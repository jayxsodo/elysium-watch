<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elysium LP 仓位看板</title>
<style>
  :root { --bg:#0b0e13; --card:#141922; --line:#232b38; --txt:#e8edf4; --dim:#8b96a5;
          --up:#3fb97f; --down:#e05d5d; --accent:#5b8def; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         padding:14px; max-width:560px; margin:0 auto; }
  h1 { font-size:17px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; margin-top:3px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .b-in { background:#123528; color:var(--up); }
  .b-out { background:#3d1d1d; color:var(--down); }
  .b-none { background:#2a2f38; color:var(--dim); }
  .big { font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:6px; }
  .big small { font-size:15px; color:var(--dim); font-weight:500; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:12px; }
  .k { color:var(--dim); font-size:12px; }
  .v { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; }
  .v small { font-size:12px; color:var(--dim); font-weight:500; }
  .up { color:var(--up); } .down { color:var(--down); }
  .bar { position:relative; height:10px; background:#1d2531; border-radius:99px; margin:22px 4px 6px; }
  .bar .fill { position:absolute; top:0; bottom:0; border-radius:99px; background:#2c4a7c; }
  .bar .dot { position:absolute; top:50%; width:16px; height:16px; border-radius:50%; background:var(--accent);
              border:2px solid #dbe7ff; transform:translate(-50%,-50%); }
  .barlab { display:flex; justify-content:space-between; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .row .rv { font-weight:600; font-variant-numeric:tabular-nums; }
  .foot { color:var(--dim); font-size:11px; margin-top:12px; line-height:1.6; }
  .err { color:var(--down); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>Elysium LP 仓位看板 <span id="posTitle"></span></h1>
<div class="sub">自动跟随 LP 热钱包的当前仓位——平仓、新开仓都会自动切换，不用换链接。<br>
<span id="meta">加载中…</span></div>

<div class="card">
  <div><span id="statusBadge" class="badge b-none">读取中</span>
       <span id="rangeTxt" style="color:var(--dim);font-size:12px;margin-left:8px"></span></div>
  <div class="big"><span id="totalHype">—</span> <small>HYPE ≈ </small><span id="totalUsd">—</span></div>
  <div class="grid">
    <div><div class="k">浮盈亏（对入场市值）</div><div class="v" id="pnl">—</div></div>
    <div><div class="k">未领手续费</div><div class="v" id="fees">—</div></div>
    <div><div class="k">KNTQ 现价（HYPE）</div><div class="v" id="price">—</div></div>
    <div><div class="k">Elysium 溢价（对 HyperEVM）</div><div class="v" id="premium">—</div></div>
    <div><div class="k">仓内 HYPE</div><div class="v" id="amt0">—</div></div>
    <div><div class="k">仓内 KNTQ</div><div class="v" id="amt1">—</div></div>
    <div><div class="k">入场价 / 入场市值</div><div class="v" id="entry">—</div></div>
    <div><div class="k">开仓时间</div><div class="v" id="openedAt">—</div></div>
  </div>
  <div class="bar" id="bar" style="display:none"><div class="fill" id="barFill"></div><div class="dot" id="barDot"></div></div>
  <div class="barlab" id="barLab" style="display:none"><span id="labLo"></span><span id="labMid">现价在区间中的位置</span><span id="labHi"></span></div>
  <div class="err" id="err"></div>
</div>

<div class="card">
  <div class="row"><span>LP 钱包闲置 HYPE</span><span class="rv" id="wHype">—</span></div>
  <div class="row"><span>LP 钱包闲置 KNTQ</span><span class="rv" id="wKntq">—</span></div>
  <div class="row"><span>钱包地址</span><span class="rv" style="font-size:12px">0xA2eC…6f9a</span></div>
</div>

<div class="foot" id="foot">数据源：Elysium 官方 RPC 链上直读，每 20 秒刷新（页面切后台暂停）。<br>
<span id="shells"></span></div>

<script>
"use strict";
const RPC = "https://rpc.elysium.kinetiq.xyz";
const HYP_RPC = "https://rpc.hyperliquid.xyz/evm";
const NPM = "0x1d1C51b9d07fD27d36412A2b66CC23D19Eb3E518";
const SV  = "0x27eD73aE0652fdCf71d6793412A7525f32bE9dfE";
const KNTQ= "0xe45a355d9e9cAd2aD85F2d03E3eE3102A036acF0";
const ALG = "0xC8e5EE73b80bb3f6c9b5348771De8217aBD412E7";
const WALLET = "0xA2eC4c3874640d18f97A1A6B2c725a371A426f9a";
const POOL_ID = "c96bfd21d36f8e7252f0d80fcb5f3bcacdf47c8b927b20711104713ebeb383ac";
const TRANSFER_TOPIC = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
const SEL = { nextTokenId:"0x75794a3c", balanceOf:"0x70a08231", ownerOf:"0x6352211e",
  getPosLiq:"0x1efeed33", getPoolPosInfo:"0x7ba03aad", getSlot0:"0xc815641c",
  getFGInside:"0x53e9c1fb", getPosInfo:"0xdacf1d2f", globalState:"0xe76c01e4" };
const $ = id => document.getElementById(id);
const pad = (h) => h.padStart(64, "0");
const encUint = n => pad(BigInt(n).toString(16));
const encAddr = a => pad(a.slice(2).toLowerCase());
const encI24 = n => pad((BigInt(n) & ((1n<<256n)-1n)).toString(16));
const W = (hex, i) => BigInt("0x" + hex.slice(2 + i*64, 2 + (i+1)*64));
const int24 = v => { v = v & 0xffffffn; return v >= 0x800000n ? Number(v - 0x1000000n) : Number(v); };
const fmt = (x, d=4) => x.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});

let rpcId = 0;
async function rpc(url, method, params) {
  const r = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({jsonrpc:"2.0", id:++rpcId, method, params}) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || method);
  return j.result;
}
async function rpcBatch(calls) { // calls: [{method, params}] all on Ely RPC; falls back to singles
  try {
    const body = calls.map(c => ({jsonrpc:"2.0", id:++rpcId, method:c.method, params:c.params}));
    const r = await fetch(RPC, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!Array.isArray(j)) throw new Error("no batch");
    const byId = {}; j.forEach(x => byId[x.id] = x);
    return body.map(b => { const x = byId[b.id]; if (!x || x.error) throw new Error("batch item"); return x.result; });
  } catch (e) {
    const out = [];
    for (const c of calls) out.push(await rpc(RPC, c.method, c.params));
    return out;
  }
}
const call = (to, data, block="latest") => rpc(RPC, "eth_call", [{to, data}, block]);

// ---------- position discovery (generic: follows whatever position is live) ----------
let ownedCache = null;      // [{id, liq(BigInt), tl, tu, mainPool}]
let activeId = null;
let deepScanned = false;

async function scanDown(fromId, toId) { // returns list of ids owned by wallet in [toId..fromId]
  const owned = [];
  for (let hi = fromId; hi >= toId; hi -= 40) {
    const lo = Math.max(toId, hi - 39);
    const calls = [];
    for (let id = hi; id >= lo; id--) calls.push({method:"eth_call",
      params:[{to:NPM, data:SEL.ownerOf + encUint(id)}, "latest"]});
    const res = await rpcBatch(calls);
    res.forEach((r, i) => { if (("0x" + r.slice(-40)).toLowerCase() === WALLET.toLowerCase()) owned.push(hi - i); });
  }
  return owned;
}
async function describePos(id) {
  const [liqHex, infoHex] = await rpcBatch([
    {method:"eth_call", params:[{to:NPM, data:SEL.getPosLiq + encUint(id)}, "latest"]},
    {method:"eth_call", params:[{to:NPM, data:SEL.getPoolPosInfo + encUint(id)}, "latest"]}]);
  const c1 = "0x" + infoHex.slice(2 + 64, 2 + 128).slice(-40);
  const fee = Number(W(infoHex, 2)), spacing = Number(W(infoHex, 3));
  const info = W(infoHex, 5);
  return { id, liq: BigInt(liqHex),
           tl: int24(info >> 8n), tu: int24(info >> 32n),
           mainPool: c1.toLowerCase() === KNTQ.toLowerCase() && fee === 10000 && spacing === 200 };
}
async function discover() {
  const [nextHex, balHex] = await rpcBatch([
    {method:"eth_call", params:[{to:NPM, data:SEL.nextTokenId}, "latest"]},
    {method:"eth_call", params:[{to:NPM, data:SEL.balanceOf + encAddr(WALLET)}, "latest"]}]);
  const nextId = Number(BigInt(nextHex)), balance = Number(BigInt(balHex));
  if (balance === 0) { ownedCache = []; activeId = null; return; }
  // Phase A: scan every id above the known active one (a new position always
  // has a higher id), plus a small look-back when nothing is active.
  const floorA = activeId ? activeId : Math.max(1, nextId - 300);
  let found = await scanDown(nextId - 1, floorA);
  // Phase B (once per session): deep scan for older shells below the window.
  if (!deepScanned) {
    if (found.length < balance && floorA > 1) {
      const rest = await scanDown(floorA - 1, 1);
      found = found.concat(rest);
    }
    deepScanned = true;
  }
  // Re-verify ownership of cached ids this round's scan did not cover.
  const cachedIds = (ownedCache || []).map(p => p.id).filter(id => !found.includes(id) && id < floorA);
  if (cachedIds.length) {
    const res = await rpcBatch(cachedIds.map(id => ({method:"eth_call",
      params:[{to:NPM, data:SEL.ownerOf + encUint(id)}, "latest"]})));
    res.forEach((r, i) => { if (("0x" + r.slice(-40)).toLowerCase() === WALLET.toLowerCase()) found.push(cachedIds[i]); });
  }
  let ids = [...new Set(found)].sort((a,b) => b - a).slice(0, balance + 5);
  ownedCache = [];
  for (const id of ids) { try { ownedCache.push(await describePos(id)); } catch(e) {} }
  const act = ownedCache.find(p => p.mainPool && p.liq > 0n);
  activeId = act ? act.id : null;
}

// ---------- entry (mint) lookup ----------
const entryCache = {}; // tokenId -> {block, ts, q, a0, a1, value}
async function findEntry(pos) {
  if (entryCache[pos.id]) return entryCache[pos.id];
  const tip = Number(BigInt(await rpc(RPC, "eth_blockNumber", [])));
  let mintBlock = null;
  const topics = [TRANSFER_TOPIC, "0x" + "0".repeat(64), "0x" + encAddr(WALLET), "0x" + encUint(pos.id)];
  for (let hi = tip; hi > 0 && mintBlock === null; hi -= 250000) {
    const lo = Math.max(0, hi - 249999);
    try {
      const logs = await rpc(RPC, "eth_getLogs", [{address:NPM, fromBlock:"0x"+lo.toString(16),
        toBlock:"0x"+hi.toString(16), topics}]);
      if (logs && logs.length) mintBlock = Number(BigInt(logs[0].blockNumber));
    } catch(e) { break; }
  }
  if (mintBlock === null) return null;
  const blk = await rpc(RPC, "eth_getBlockByNumber", ["0x" + mintBlock.toString(16), false]);
  const s0 = await call(SV, SEL.getSlot0 + POOL_ID, "0x" + mintBlock.toString(16));
  const s = Number(W(s0, 0)) / 2**96;
  const q = 1 / (s * s);
  const [a0, a1] = amounts(Number(pos.liq), s, pos.tl, pos.tu);
  const out = { block: mintBlock, ts: Number(BigInt(blk.timestamp)), q, a0, a1, value: a0 + a1 * q };
  entryCache[pos.id] = out;
  return out;
}

// ---------- math ----------
function amounts(L, s, tl, tu) { // returns [HYPE, KNTQ] in whole units
  const sA = Math.pow(1.0001, tl / 2), sB = Math.pow(1.0001, tu / 2);
  let a0, a1;
  if (s <= sA)      { a0 = L * (1/sA - 1/sB); a1 = 0; }
  else if (s >= sB) { a0 = 0; a1 = L * (sB - sA); }
  else              { a0 = L * (1/s - 1/sB); a1 = L * (s - sA); }
  return [a0 / 1e18, a1 / 1e18];
}
async function hypeUsd() {
  const r = await fetch("https://api.hyperliquid.xyz/info", { method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({type:"allMids"}) });
  const j = await r.json();
  return parseFloat(j.HYPE);
}

// ---------- main refresh ----------
let busy = false;
async function refresh() {
  if (busy || document.hidden) return;
  busy = true;
  try {
    await discover();
    const shells = (ownedCache || []).filter(p => !(p.mainPool && p.liq > 0n));
    $("shells").textContent = shells.length ?
      "钱包另持有 NFT：" + shells.map(p => "#" + p.id + (p.liq > 0n ? "（其他池）" : "（已平仓）")).join("、") : "";
    const pos = (ownedCache || []).find(p => p.mainPool && p.liq > 0n);
    // wallet balances always
    const [balHex, kntqHex, usd] = await Promise.all([
      rpc(RPC, "eth_getBalance", [WALLET, "latest"]),
      call(KNTQ, SEL.balanceOf + encAddr(WALLET)),
      hypeUsd().catch(() => null)]);
    $("wHype").textContent = fmt(Number(BigInt(balHex)) / 1e18) + " HYPE";
    $("wKntq").textContent = fmt(Number(BigInt(kntqHex)) / 1e18, 2) + " KNTQ";
    const tip = Number(BigInt(await rpc(RPC, "eth_blockNumber", [])));
    $("meta").textContent = "更新 " + new Date().toLocaleTimeString("zh-CN") + " · 块 " + tip.toLocaleString();
    if (!pos) {
      $("posTitle").textContent = "";
      $("statusBadge").className = "badge b-none"; $("statusBadge").textContent = "当前无仓位";
      $("rangeTxt").textContent = ""; $("totalHype").textContent = "—"; $("totalUsd").textContent = "";
      ["pnl","fees","price","premium","amt0","amt1","entry","openedAt"].forEach(i => $(i).textContent = "—");
      $("bar").style.display = "none"; $("barLab").style.display = "none";
      $("err").textContent = ""; busy = false; return;
    }
    $("posTitle").textContent = "· 仓位 #" + pos.id;
    const L = Number(pos.liq);
    const [s0, fgNow, posInfo, gs] = await Promise.all([
      call(SV, SEL.getSlot0 + POOL_ID),
      call(SV, SEL.getFGInside + POOL_ID + encI24(pos.tl) + encI24(pos.tu)),
      call(SV, SEL.getPosInfo + POOL_ID + encAddr(NPM) + encI24(pos.tl) + encI24(pos.tu) + encUint(pos.id)),
      rpc(HYP_RPC, "eth_call", [{to:ALG, data:SEL.globalState}, "latest"]).catch(() => null)]);
    const sqrtP = W(s0, 0), tick = int24(W(s0, 1));
    const s = Number(sqrtP) / 2**96, q = 1 / (s * s);
    const [a0, a1] = amounts(L, s, pos.tl, pos.tu);
    const valueHype = a0 + a1 * q;
    // uncollected fees (exact: feeGrowthInside now vs position's last)
    const fg0n = W(fgNow, 0), fg1n = W(fgNow, 1);
    const fg0l = W(posInfo, 1), fg1l = W(posInfo, 2);
    const M = (1n << 256n);
    const fee0 = Number(((fg0n - fg0l + M) % M) * pos.liq / (1n << 128n)) / 1e18;
    const fee1 = Number(((fg1n - fg1l + M) % M) * pos.liq / (1n << 128n)) / 1e18;
    const feesHype = fee0 + fee1 * q;
    const total = valueHype + feesHype;
    $("totalHype").textContent = fmt(total);
    $("totalUsd").textContent = usd ? "$" + fmt(total * usd, 2) : "";
    $("fees").innerHTML = fmt(fee0) + " <small>HYPE + </small>" + fmt(fee1, 2) + " <small>KNTQ</small>";
    $("price").textContent = q.toFixed(6);
    $("amt0").textContent = fmt(a0) + " HYPE";
    $("amt1").textContent = fmt(a1, 2) + " KNTQ";
    if (gs) {
      const sh = Number(W(gs, 0)) / 2**96;
      const hypQ = sh * sh;
      const prem = (q / hypQ - 1) * 100;
      $("premium").textContent = (prem >= 0 ? "+" : "") + prem.toFixed(2) + "%";
      $("premium").className = "v " + (prem >= 0 ? "up" : "down");
    }
    const inRange = tick >= pos.tl && tick < pos.tu;
    $("statusBadge").className = "badge " + (inRange ? "b-in" : "b-out");
    $("statusBadge").textContent = inRange ? "区间内 · 正在赚手续费" : (tick < pos.tl ? "已出区间（下）· 全部为 KNTQ" : "已出区间（上）· 全部为 HYPE");
    const qLo = Math.pow(1.0001, -pos.tu), qHi = Math.pow(1.0001, -pos.tl);
    $("rangeTxt").textContent = "区间 " + qLo.toFixed(6) + " – " + qHi.toFixed(6) + " HYPE/KNTQ";
    const pctPos = Math.min(100, Math.max(0, (tick - pos.tl) / (pos.tu - pos.tl) * 100));
    $("bar").style.display = "block"; $("barLab").style.display = "flex";
    $("barFill").style.left = "0%"; $("barFill").style.width = "100%";
    $("barDot").style.left = pctPos + "%";
    $("labLo").textContent = qHi.toFixed(4) + "（tick " + pos.tl + "）";
    $("labHi").textContent = qLo.toFixed(4) + "（tick " + pos.tu + "）";
    const ent = await findEntry(pos).catch(() => null);
    if (ent) {
      const pnl = total - ent.value, pnlPct = pnl / ent.value * 100;
      $("pnl").innerHTML = (pnl >= 0 ? "+" : "") + fmt(pnl) + " <small>HYPE (" + (pnl >= 0 ? "+" : "") + pnlPct.toFixed(2) + "%)</small>";
      $("pnl").className = "v " + (pnl >= 0 ? "up" : "down");
      $("entry").innerHTML = ent.q.toFixed(6) + " <small>/ </small>" + fmt(ent.value) + " <small>HYPE</small>";
      $("openedAt").textContent = new Date(ent.ts * 1000).toLocaleString("zh-CN", {hour12:false});
    } else { $("pnl").textContent = "—"; $("entry").textContent = "—"; $("openedAt").textContent = "—"; }
    $("err").textContent = "";
  } catch (e) {
    $("err").textContent = "本轮读取失败（节点繁忙），自动重试中…";
  }
  busy = false;
}
refresh();
setInterval(refresh, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
